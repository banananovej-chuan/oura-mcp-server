[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oura-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol server for Oura Ring health data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Viet Anh Chu" }]
keywords = ["mcp", "oura", "oura-ring", "health", "sleep", "wearable", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp[cli]>=1.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/banananovej-chuan/oura-mcp-server"
Repository = "https://github.com/banananovej-chuan/oura-mcp-server"

[project.scripts]
oura-mcp-server = "oura_mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
